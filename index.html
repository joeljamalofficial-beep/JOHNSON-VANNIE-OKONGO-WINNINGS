<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Notification</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top left, #1e3a8a, #0f172a 60%);
    color: #0f172a;
  }

  .notice-card {
    position: relative;
    width: min(760px, 100%);
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    animation: rise 0.7s ease-out;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(18px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .watermark {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(2rem, 10vw, 6rem);
    font-weight: 900;
    color: rgba(220, 38, 38, 0.08);
    transform: rotate(-24deg);
    pointer-events: none;
    user-select: none;
    letter-spacing: 4px;
    text-align: center;
    z-index: 1;
  }

  .banner {
    position: relative;
    z-index: 2;
    background: #facc15;
    color: #111827;
    text-align: center;
    padding: 12px 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 0.85rem;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 32px;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 18px;
    color: #1e3a8a;
  }

  #typed {
    min-height: 260px;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 1rem;
    color: #1f2937;
    border-left: 4px solid #1e3a8a;
    padding-left: 18px;
  }

  .cursor {
    display: inline-block;
    width: 9px;
    height: 1.1em;
    background: #1e3a8a;
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 0.8s steps(1) infinite;
  }

  @keyframes blink {
    50% {
      opacity: 0;
    }
  }

  .actions {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  button {
    border: none;
    border-radius: 999px;
    padding: 12px 18px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .copy-btn {
    background: #1e3a8a;
    color: white;
  }

  .copy-btn:hover {
    background: #172554;
    transform: translateY(-2px);
  }

  .print-btn {
    background: #e5e7eb;
    color: #111827;
  }

  .print-btn:hover {
    background: #d1d5db;
    transform: translateY(-2px);
  }

  @media (max-width: 520px) {
    .content {
      padding: 22px;
    }

    #typed {
      font-size: 0.95rem;
      padding-left: 14px;
    }
  }

  @media print {
    body {
      background: white;
      padding: 0;
    }

    .actions,
    .banner {
      display: none;
    }

    .notice-card {
      box-shadow: none;
      border-radius: 0;
    }

    .watermark {
      color: rgba(220, 38, 38, 0.12);
    }
  }
</style>
</head>
<body>

  <main class="notice-card">
    <div class="watermark">SAMPLE ONLY</div>
    <div class="banner">Sample — Not a real prize notification</div>

    <div class="content">
      <h1>Sample Notification</h1>
      <div id="typed"><span class="cursor"></span></div>

      <div class="actions">
        <button class="copy-btn" onclick="copyText()">Copy text</button>
        <button class="print-btn" onclick="window.print()">Print</button>
      </div>
    </div>
  </main>

<script>
  const message = `Dear {{NAME}},

This is a clearly marked sample notification. It is not a real prize, lottery, or winning claim.

In this demo, a record of UGX {{AMOUNT}} is shown for illustration only. No real funds are owed, pending, or available.

If this were a legitimate notification, it would include verifiable contact details, official terms, and no urgent demand for fees or personal information.

Thank you.`;

  const target = document.getElementById("typed");
  const cursor = document.querySelector(".cursor");
  let index = 0;

  function typeWriter() {
    if (index < message.length) {
      cursor.insertAdjacentText("beforebegin", message.charAt(index));
      index++;
      setTimeout(typeWriter, 18);
    }
  }

  typeWriter();

  function copyText() {
    navigator.clipboard.writeText(message).then(() => {
      alert("Sample text copied.");
    }).catch(() => {
      alert("Copy failed. Please select the text manually.");
    });
  }
</script>

</body>
</html>
